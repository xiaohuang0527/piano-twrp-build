name: Build TWRP Recovery (piano)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      # ---------- 腾空间 ----------
      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/node \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          echo "=== after ==="
          df -h /

      # ---------- swap ----------
      - name: Setup swap (8G)
        run: |
          sudo fallocate -l 8G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show
          free -h

      # ---------- 依赖 ----------
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev libncurses5 libncurses5-dev lib32ncurses6 lib32z1-dev \
            x11proto-core-dev libx11-dev lib32z1 lib32readline-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip rsync imagemagick
          df -h /

      # ---------- repo ----------
      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Git identity
        run: |
          git config --global user.name "pianoci"
          git config --global user.email "ci@piano.local"
          git config --global color.ui false

      # ---------- repo init: TWRP-Test AOSP, twrp-14.0 ----------
      - name: Repo init (TWRP twrp-14.0)
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 --no-clone-bundle \
            -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git \
            -b twrp-14.0 2>&1 | tail -30

      # ---------- sync ----------
      - name: Repo sync
        run: |
          cd ~/twrp
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags \
            2>&1 | tail -40
          df -h /
          du -sh ~/twrp

      # ---------- 放入设备树 ----------
      - name: Add device tree
        run: |
          cd ~/twrp
          rm -rf device/xiaomi/piano
          mkdir -p device/xiaomi
          cp -r "$GITHUB_WORKSPACE/device_tree" device/xiaomi/piano
          rm -rf device/xiaomi/piano/.git device/xiaomi/piano/.github
          echo "=== device tree ==="
          ls device/xiaomi/piano
          echo "=== AndroidProducts.mk ==="
          cat device/xiaomi/piano/AndroidProducts.mk

      # ---------- lunch 自检 ----------
      - name: Self-check lunch target
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh > /tmp/envsetup.log 2>&1 || true
          echo "=== lunch 前可用目标（含 piano） ==="
          grep -ri "piano" build/make/target/product/AndroidProducts.mk 2>/dev/null || echo "(no global ref)"
          echo "=== 尝试 lunch ==="
          lunch twrp_piano-eng 2>&1 | tail -40

      # ---------- lunch + build ----------
      - name: Build recovery
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          set -o pipefail
          source build/envsetup.sh
          lunch twrp_piano-eng
          echo "=== TARGET_PRODUCT=$TARGET_PRODUCT TARGET_DEVICE=$TARGET_DEVICE ==="
          mka recoveryimage -j$(nproc --all) 2>&1 | tee /tmp/recovery-build.log | tail -200
        continue-on-error: true

      # ---------- 产物 ----------
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out_artifacts"
          find "$HOME/twrp/out/target/product/piano" -maxdepth 1 -type f \
            \( -name "*.img" -o -name "*.zip" \) \
            -exec cp {} "$GITHUB_WORKSPACE/out_artifacts/" \; 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/out_artifacts/" || true
          echo "=== out/target/product/piano 内容 ==="
          ls -lh "$HOME/twrp/out/target/product/piano/" 2>/dev/null | head -40 || true
          df -h /

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piano-twrp
          path: out_artifacts/
          if-no-files-found: warn
          retention-days: 14

      # ---------- 编译日志也存一份，方便排错 ----------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /tmp/recovery-build.log
            /tmp/envsetup.log
            /home/runner/twrp/out/verbose.log.gz
            /home/runner/twrp/out/error.log
            /home/runner/twrp/out/soong.log
          if-no-files-found: ignore
          retention-days: 7
